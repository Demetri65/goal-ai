[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "smart-got"
version = "0.0.1"
description = "SMART-GoT lean prototype: interactive SMART workstream graph"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="SMART-GoT Prototype"}]
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
smartgot = "smart_got.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
